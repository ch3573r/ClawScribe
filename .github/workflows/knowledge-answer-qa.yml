name: Knowledge answer synthetic review
on:
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'Exact reviewed feature SHA with passing native validation'
        type: string
        required: true
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: knowledge-answer-qa
  cancel-in-progress: false

jobs:
  answer-qa:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: 240
    permissions:
      contents: read
      checks: write
    steps:
      - name: Require the designated local build machine
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BUILD_REF: ${{ inputs['build-ref'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Validation requires the designated local runner.'
          }
          if ($env:BUILD_REF -notmatch '^[0-9a-f]{40}$' -or $env:GITHUB_REPOSITORY -ne 'ch3573r/ClawScribe') {
            throw 'An immutable reviewed repository commit is required.'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs['build-ref'] }}
          clean: false
          persist-credentials: false
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: false
      - name: Run fixed actual answer evaluation
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          CLAWSCRIBE_VALIDATION_ROOT: ${{ vars.CLAWSCRIBE_VALIDATION_ROOT }}
          BUILD_REF: ${{ inputs['build-ref'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git rev-parse HEAD).Trim() -ne $env:BUILD_REF) { throw 'Evaluation checkout mismatch.' }
          try { ./frontend/scripts/test-knowledge.ps1 -FullSuite:$false -AnswerAcceptance }
          finally {
            if (Test-Path -LiteralPath $env:GITHUB_STEP_SUMMARY -PathType Leaf) {
              $report = Join-Path $env:RUNNER_TEMP "clawscribe-answer-qa-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.md"
              Copy-Item -LiteralPath $env:GITHUB_STEP_SUMMARY -Destination $report
            }
          }
      - name: Publish bounded invented-only review report
        if: ${{ always() }}
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BUILD_REF: ${{ inputs['build-ref'] }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-answer-qa.mjs
