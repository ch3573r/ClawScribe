name: Verify and publish completed 0.5.36 prerelease

on:
  push:
    branches: ['verification/0.5.36-final']
    paths: ['scripts/verify-0.5.36-preview.cjs', 'scripts/test-release-verification.cjs', '.github/workflows/verify-0.5.36-final.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-publish-clawscribe-0.5.36
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install signature verifier
        run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - name: Check safety, syntax and deterministic rejection gates
        run: |
          set -euo pipefail
          node scripts/verify-public-repo-safety.mjs
          node --check scripts/verify-0.5.36-preview.cjs
          node --check scripts/test-release-verification.cjs
          node scripts/test-release-verification.cjs
  publish:
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install signature verifier
        run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - name: Verify the exact completed build and release assets before publication
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/verify-0.5.36-preview.cjs')({github, context, core});
