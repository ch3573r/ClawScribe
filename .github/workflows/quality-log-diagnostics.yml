name: Quality native failure diagnostics
on:
  push:
    branches: ['automation/quality-review-2026-09-06']
    paths: ['.github/workflows/quality-log-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [34032717239,34034292644]) {
              const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              const {data:page}=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id,per_page:100});
              for(const job of page.jobs.filter(job=>job.name==='windows')) {
                core.info(JSON.stringify({run_id,source:run.head_sha,job_id:job.id,status:job.status,conclusion:job.conclusion,steps:job.steps.map(({name,conclusion})=>({name,conclusion}))}));
                if(job.status!=='completed')continue;
                const response=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...context.repo,job_id:job.id});
                const bytes=response.headers.location?Buffer.from(await(await fetch(response.headers.location)).arrayBuffer()):Buffer.from(response.data);
                const lines=bytes.toString('utf8').split('\n');
                const selected=new Set();
                lines.forEach((line,index)=>{if(/FAILED|panicked|error\[|error:|error\]|test result:|Running \d+ required native tests|Native tests failed|No tests matched/i.test(line))for(let i=Math.max(0,index-2);i<=Math.min(lines.length-1,index+8);i++)selected.add(i);});
                core.info([...selected].sort((a,b)=>a-b).map(index=>lines[index]).join('\n').slice(-22000));
              }
            }
