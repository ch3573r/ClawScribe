name: ClawScribe Windows Release

on:
  workflow_call:
    inputs:
      feature:
        type: string
        default: windows-gpu
      check-only:
        type: boolean
        default: false
      build-ref:
        type: string
        default: ""
      directml:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      draft-release:
        type: boolean
        default: false
      capture-smoke-confirmed:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      feature:
        description: Build acceleration feature set
        required: true
        type: choice
        default: windows-gpu
        options:
          - cpu
          - windows-gpu
          - vulkan
          - directml
          - cuda
          - openblas
      check-only:
        description: Run validation only, without producing installers
        required: true
        type: boolean
        default: false
      build-ref:
        description: Commit, branch, or tag to build
        required: false
        type: string
        default: ""
      directml:
        description: Add the DirectML EP to feature sets that do not already include it.
        required: false
        type: boolean
        default: false
      publish:
        description: Publish the installers to a GitHub Release (tag = v<package.json version>). Release assets don't count against the Actions-artifact quota.
        required: false
        type: boolean
        default: false
      draft-release:
        description: Stage a draft release for testing without publishing or changing the stable updater.
        required: false
        type: boolean
        default: false
      capture-smoke-confirmed:
        description: Confirm a real Windows recording captured both microphone and system audio, stopped cleanly, and produced playable audio.
        required: false
        type: boolean
        default: false

concurrency:
  group: clawscribe-windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ClawScribe Windows installers
    runs-on: [self-hosted, windows, clawscribe]
    timeout-minutes: 90
    permissions:
      contents: write # create/update GitHub Releases when publish=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # Self-hosted runner: keep untracked build outputs (target/, node_modules)
          # between runs so cargo/tauri builds are incremental. Source files are
          # still reset to the checked-out ref; only ignored artifacts persist.
          clean: false

      - name: Checkout requested build ref
        if: ${{ inputs['build-ref'] != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git checkout --detach "${{ inputs['build-ref'] }}"

      - name: Validate release mode and identify exact build commit
        id: build_identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ("${{ inputs.publish }}" -eq "true" -and "${{ inputs['draft-release'] }}" -eq "true") {
            throw "Select either publication or a draft, not both."
          }
          $commit = (git rev-parse HEAD).Trim()
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require dual-source capture smoke before publishing
        if: ${{ inputs.publish }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ("${{ inputs['capture-smoke-confirmed'] }}" -ne "true") {
            throw "Publishing requires a real Windows microphone + system-audio recording smoke after the active cpal revision changed."
          }

      - name: Normalize migration line endings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # SQLx embeds migration files at compile time and records their
          # checksums in every installed client's database. A reused runner
          # workspace can hold CRLF copies written by checkouts that predate
          # .gitattributes, and git never rewrites unchanged files when
          # attributes change. Force a fresh checkout of the migrations so the
          # build always embeds the canonical LF bytes.
          Remove-Item frontend/src-tauri/migrations/*.sql -Force
          git checkout -- frontend/src-tauri/migrations
          git ls-files --eol frontend/src-tauri/migrations

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life April 2026; 24 is the active LTS and
          # matches local development.
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Prepare Windows installer version
        if: ${{ !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $sourceVersion = node -p "require('./frontend/package.json').version"
          $installerVersion = $sourceVersion -replace "-.*$", ""
          if ($sourceVersion -ne $installerVersion) {
            $tauriConfigPath = "frontend\src-tauri\tauri.conf.json"
            $tauriConfig = Get-Content -LiteralPath $tauriConfigPath -Raw | ConvertFrom-Json
            $tauriConfig.version = $installerVersion
            $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $tauriConfigPath -Encoding utf8
          }
          "CLAWSCRIBE_SOURCE_VERSION=$sourceVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLAWSCRIBE_INSTALLER_VERSION=$installerVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Guard against updater-invisible version
        # The MSI/runtime version cannot carry prerelease metadata, so a
        # `-alpha.N` source version is stripped to a bare X.Y.Z and the updater
        # manifest advertises that stripped number. Two prereleases that strip to
        # the same number (0.5.2-alpha.1 and 0.5.2-alpha.2 -> 0.5.2) are invisible
        # to Tauri's default `new > current` comparison, so installed clients
        # never see the update. Fail fast — before the long build — when a
        # prerelease publish would not advance the stripped updater version past
        # what's already published.
        if: ${{ (inputs.publish || inputs['draft-release']) && !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $sourceVersion = $env:CLAWSCRIBE_SOURCE_VERSION
          $installerVersion = $env:CLAWSCRIBE_INSTALLER_VERSION
          if ($sourceVersion -eq $installerVersion) {
            Write-Host "No prerelease suffix on $sourceVersion; updater-version guard not applicable."
            exit 0
          }
          $manifestUrl = "https://github.com/ch3573r/ClawScribe/releases/latest/download/latest.json"
          try {
            $published = Invoke-RestMethod -Uri $manifestUrl -Headers @{ "User-Agent" = "clawscribe-release-guard" } -ErrorAction Stop
          } catch {
            Write-Host "No published updater manifest at $manifestUrl (first release?). Skipping guard."
            exit 0
          }
          $publishedVersion = "$($published.version)".Trim()
          if (-not $publishedVersion) {
            Write-Host "Published manifest carried no version field; skipping guard."
            exit 0
          }
          if ([version]$installerVersion -le [version]$publishedVersion) {
            throw "Updater guard failed: this publish strips to runtime version $installerVersion (from $sourceVersion), which is not greater than the currently published updater version $publishedVersion. A prerelease bump that strips to the same-or-lower X.Y.Z is invisible to the default Tauri updater and installed clients would never see it. Bump the numeric version (e.g. patch: $installerVersion -> next) so the stripped installer version advances."
          }
          Write-Host "Updater guard OK: $installerVersion > published $publishedVersion."

      - name: Guard against republishing an existing tag
        # Publishing tags the release as v<package.json version>. If that tag
        # already exists on a different commit, a publish from newer main would
        # silently replace the released binaries while latest.json keeps the
        # same runtime version — installed clients would never see the change
        # as an update. Fail fast and require a version bump. Republishing the
        # exact tagged commit stays allowed so failed uploads can be retried.
        if: ${{ (inputs.publish || inputs['draft-release']) && !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:CLAWSCRIBE_SOURCE_VERSION
          $tagRef = "refs/tags/v$version"
          $remote = git ls-remote origin $tagRef "$tagRef^{}"
          if (-not $remote) {
            Write-Host "Tag v$version does not exist yet; publish will create it."
            exit 0
          }
          $lines = @($remote -split "`r?`n" | Where-Object { $_ })
          $peeled = $lines | Where-Object { $_ -match [regex]::Escape("$tagRef^{}") } | Select-Object -First 1
          $line = if ($peeled) { $peeled } else { $lines[0] }
          $tagSha = ($line -split "\s+")[0]
          $headSha = (git rev-parse HEAD).Trim()
          if ($tagSha -ne $headSha) {
            throw "Tag v$version already exists at $tagSha, but this build is at $headSha. Publishing would ship different code under the already-released version and installed clients would never see it as an update. Bump the version in frontend/package.json (and Cargo.toml/tauri.conf.json) before publishing."
          }
          Write-Host "Tag v$version already points at $headSha; republishing the same commit is allowed."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Build cache is provided by the self-hosted runner's persistent disk
      # (CARGO_HOME=C:\cargo for the registry, plus clean:false above to keep
      # target/ between runs). No GitHub Actions cache is used, so nothing is
      # written to the repo's Actions cache storage.

      - name: Install LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # Pin LLVM 20.x: bindgen 0.69 (via whisper-rs-sys) mis-parses the
          # whisper_full_params struct with clang 21+, dropping fields and
          # failing the build. 20.1.8 matches the GitHub-hosted image.
          choco install llvm --version=20.1.8 -y --no-progress --allow-downgrade
          $llvmBin = "C:\Program Files\LLVM\bin"
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$llvmBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Vulkan SDK prerequisites
        if: ${{ inputs.feature == 'windows-gpu' || inputs.feature == 'vulkan' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          choco install 7zip -y --no-progress

      - name: Install Vulkan SDK
        if: ${{ inputs.feature == 'windows-gpu' || inputs.feature == 'vulkan' }}
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Verify and Configure Vulkan SDK
        if: ${{ inputs.feature == 'windows-gpu' || inputs.feature == 'vulkan' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $vulkanSdk = $env:VULKAN_SDK
          Write-Host "VULKAN_SDK: $vulkanSdk"
          if (-not $vulkanSdk -or -not (Test-Path $vulkanSdk)) {
            throw "VULKAN_SDK not set or path does not exist"
          }
          $binDir = Join-Path $vulkanSdk "Bin"
          $libDir = Join-Path $vulkanSdk "Lib"
          $includeDir = Join-Path $vulkanSdk "Include"
          foreach ($path in @($binDir, $libDir, $includeDir)) {
            if (-not (Test-Path $path)) {
              throw "Required Vulkan SDK path missing: $path"
            }
          }
          "PATH=$binDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_LIBRARY=$libDir\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_INCLUDE_DIR=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build llama-helper sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p llama-helper --release --locked --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\llama-helper.exe frontend\src-tauri\binaries\llama-helper-x86_64-pc-windows-msvc.exe -Force

      - name: Stage Codex app-server runtime
        if: ${{ !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          .\frontend\scripts\stage-codex-runtime.ps1 -TauriRoot "frontend\src-tauri"

      - name: Verify app and installer icons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          .\frontend\scripts\verify-brand-icons.ps1 -FrontendRoot "frontend"

      - name: Build release installers
        id: build_release
        if: ${{ !inputs['check-only'] }}
        shell: pwsh
        env:
          # Signs the Tauri updater artifacts (.sig) when createUpdaterArtifacts
          # is true. Empty/absent on forks without the secret -> build still works,
          # just unsigned-for-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $buildStartedAt = Get-Date
          $feature = "${{ inputs.feature }}"
          # cpu is the implicit default (no GPU feature); others map 1:1.
          $featureList = @()
          if ($feature -ne "cpu") {
            $featureList += $feature
          }
          if ("${{ inputs.directml }}" -eq "true" -and -not ($featureList -contains "directml") -and -not ($featureList -contains "windows-gpu")) {
            $featureList += "directml"
          }
          $features = ($featureList | Select-Object -Unique) -join ","
          $sherpaRuntime = if ($featureList -contains "directml" -or $featureList -contains "windows-gpu") { "directml" } else { "cpu" }
          .\frontend\scripts\stage-sherpa-runtime.ps1 -TauriRoot "frontend\src-tauri" -Runtime $sherpaRuntime
          Remove-Item -LiteralPath "frontend\src-tauri\target\release\bundle\msi" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "frontend\src-tauri\target\release\bundle\nsis" -Recurse -Force -ErrorAction SilentlyContinue
          cd frontend
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          if ($features) {
            pnpm exec tauri build -- --locked --features $features
          } else {
            pnpm exec tauri build -- --locked
          }
          $buildElapsedSeconds = [Math]::Round(((Get-Date) - $buildStartedAt).TotalSeconds, 3)
          $buildElapsedSecondsText = $buildElapsedSeconds.ToString("0.###", [System.Globalization.CultureInfo]::InvariantCulture)
          "build_elapsed_seconds=$buildElapsedSecondsText" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run native summary and resource regression tests
        if: ${{ !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $featureList = @()
          if ("${{ inputs.feature }}" -ne "cpu") { $featureList += "${{ inputs.feature }}" }
          if ("${{ inputs.directml }}" -eq "true" -and "${{ inputs.feature }}" -notin @("windows-gpu", "directml")) { $featureList += "directml" }
          $featureArgs = @()
          if ($featureList.Count -gt 0) { $featureArgs = @("--features", ($featureList -join ",")) }
          foreach ($filter in @("summary::processor::tests", "summary::chunking::tests", "audio::async_logger::tests", "audio::hardware_detector::tests")) {
            cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml @featureArgs --lib $filter -- --test-threads=1
          }

      - name: Write build metadata
        if: ${{ !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $bundleRoot = "frontend\src-tauri\target\release\bundle"
          $sourceVersion = $env:CLAWSCRIBE_SOURCE_VERSION
          $installerVersion = $env:CLAWSCRIBE_INSTALLER_VERSION
          $commit = git rev-parse HEAD
          $shortCommit = git rev-parse --short HEAD
          $buildDateUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $upstreamBaseVersion = "0.4.0"
          $expectedMsi = "ClawScribe_${installerVersion}_x64_en-US.msi"
          $expectedNsis = "ClawScribe_${installerVersion}_x64-setup.exe"
          $sourceMsi = Get-ChildItem -Path "." -Recurse -File -Filter $expectedMsi |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $sourceNsis = Get-ChildItem -Path "." -Recurse -File -Filter $expectedNsis |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $sourceMsi) {
            throw "No current-version ClawScribe MSI artifact '$expectedMsi' was found after the Windows build."
          }
          if (-not $sourceNsis) {
            throw "No current-version ClawScribe NSIS setup artifact '$expectedNsis' was found after the Windows build."
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "msi") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "nsis") | Out-Null
          $msiName = $sourceMsi.Name
          $nsisName = $sourceNsis.Name
          if ($sourceVersion -ne $installerVersion) {
            $msiName = $msiName.Replace($installerVersion, $sourceVersion)
            $nsisName = $nsisName.Replace($installerVersion, $sourceVersion)
          }
          $destMsi = Join-Path $bundleRoot "msi\$msiName"
          $destNsis = Join-Path $bundleRoot "nsis\$nsisName"
          $destMsiFull = [System.IO.Path]::GetFullPath($destMsi)
          $destNsisFull = [System.IO.Path]::GetFullPath($destNsis)
          if ($sourceMsi.FullName -ne $destMsiFull) {
            Move-Item -LiteralPath $sourceMsi.FullName -Destination $destMsi -Force
          }
          if ($sourceNsis.FullName -ne $destNsisFull) {
            $sourceNsisSig = "$($sourceNsis.FullName).sig"
            $destNsisSig = "$destNsis.sig"
            Move-Item -LiteralPath $sourceNsis.FullName -Destination $destNsis -Force
            if (Test-Path -LiteralPath $sourceNsisSig -PathType Leaf) {
              Move-Item -LiteralPath $sourceNsisSig -Destination $destNsisSig -Force
            }
          }
          $artifactFiles = @(
            Get-Item -LiteralPath $destMsi
            Get-Item -LiteralPath $destNsis
          )
          $resolvedBundleRoot = (Resolve-Path -LiteralPath $bundleRoot).Path
          $checksumLines = foreach ($artifact in $artifactFiles | Sort-Object FullName) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName
            $relativePath = [System.IO.Path]::GetRelativePath($resolvedBundleRoot, $artifact.FullName).Replace("\", "/")
            "$($hash.Hash.ToLowerInvariant())  $relativePath"
          }
          $checksumLines | Set-Content -LiteralPath (Join-Path $bundleRoot "SHA256SUMS.txt") -Encoding ascii
          $metadata = @(
            "product=ClawScribe",
            "version=$sourceVersion",
            "upstream_base_version=$upstreamBaseVersion",
            "installer_product_version=$installerVersion",
            "build_commit=$commit",
            "build_commit_short=$shortCommit",
            "build_date_utc=$buildDateUtc",
            "codex_runtime_version=0.144.1",
            "codex_runtime_target=x86_64-pc-windows-msvc",
            "codex_runtime_source_package=@openai/codex@0.144.1-win32-x64",
            "codex_runtime_source_url=https://registry.npmjs.org/@openai/codex/-/codex-0.144.1-win32-x64.tgz",
            "codex_runtime_sha256=cbacbb9726262ef558b4af0438a1b2a5bba9076132401d947b5b4d2bf92ab0e4",
            "codex_runtime_license=Apache-2.0",
            "workflow_ref=${{ github.ref }}",
            "requested_build_ref=${{ inputs['build-ref'] || github.ref }}"
          )
          $metadata | Set-Content -LiteralPath (Join-Path $bundleRoot "BUILD-METADATA.txt") -Encoding ascii
          $metrics = [ordered]@{
            product = "ClawScribe"
            version = $sourceVersion
            installer_product_version = $installerVersion
            build_commit = $commit
            build_commit_short = $shortCommit
            build_date_utc = $buildDateUtc
            workflow_ref = "${{ github.ref }}"
            requested_build_ref = "${{ inputs['build-ref'] || github.ref }}"
            requested_feature = "${{ inputs.feature }}"
            directml_input = "${{ inputs.directml }}"
            sherpa_runtime = "${{ steps.build_release.outputs.sherpa_runtime }}"
            sherpa_version = "${{ steps.build_release.outputs.sherpa_version }}"
            sherpa_cache = "${{ steps.build_release.outputs.sherpa_cache }}"
            sherpa_elapsed_seconds = "${{ steps.build_release.outputs.sherpa_elapsed_seconds }}"
            build_elapsed_seconds = "${{ steps.build_release.outputs.build_elapsed_seconds }}"
          }
          $metrics | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $bundleRoot "BUILD-METRICS.json") -Encoding utf8

      - name: Run validation only
        if: ${{ inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd frontend
          .\scripts\build-windows-release.ps1 -Feature ${{ inputs.feature }} -CheckOnly

      - name: Upload Windows installers
        # Skip on publish runs: the GitHub Release is the distribution there, so
        # we avoid the Actions-artifact quota entirely. Dev (non-publish) runs
        # still get a downloadable artifact.
        if: ${{ !inputs['check-only'] && !inputs.publish && !inputs['draft-release'] }}
        uses: actions/upload-artifact@v4
        with:
          # Stable per-variant name (no per-commit sha) + overwrite so each
          # variant keeps exactly ONE latest artifact (~287MB) instead of
          # accumulating one per commit. The free tier only includes 500MB of
          # Actions storage; the old sha-suffixed name climbed past that and
          # blocked uploads ("Artifact storage quota has been hit"). The commit
          # sha stays traceable via the run page and the bundled
          # BUILD-METADATA.txt.
          name: clawscribe-windows-${{ inputs.feature }}${{ inputs.directml && inputs.feature != 'windows-gpu' && inputs.feature != 'directml' && '-directml' || '' }}
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/SHA256SUMS.txt
            frontend/src-tauri/target/release/bundle/BUILD-METADATA.txt
            frontend/src-tauri/target/release/bundle/BUILD-METRICS.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Prepare release notes
        if: ${{ (inputs.publish || inputs['draft-release']) && !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $bundleRoot = "frontend\src-tauri\target\release\bundle"
          $version = $env:CLAWSCRIBE_SOURCE_VERSION
          $runtimeVersion = $env:CLAWSCRIBE_INSTALLER_VERSION
          $short = git rev-parse --short HEAD
          $changelog = New-Object System.Collections.Generic.List[string]
          $changelogPath = "CHANGELOG.md"
          if (Test-Path -LiteralPath $changelogPath) {
            $capture = $false
            foreach ($line in Get-Content -LiteralPath $changelogPath) {
              if ($line -eq "## $version") {
                $capture = $true
                continue
              }
              if ($capture -and $line -match "^##\s+") {
                break
              }
              if ($capture) {
                $changelog.Add($line)
              }
            }
          }
          while ($changelog.Count -gt 0 -and [string]::IsNullOrWhiteSpace($changelog[0])) {
            $changelog.RemoveAt(0)
          }
          while ($changelog.Count -gt 0 -and [string]::IsNullOrWhiteSpace($changelog[$changelog.Count - 1])) {
            $changelog.RemoveAt($changelog.Count - 1)
          }
          if ($changelog.Count -eq 0) {
            $changelog.Add("- See the commits included in this release for details.")
          }
          # Built line-by-line (no backticks) to avoid PowerShell here-string escaping.
          $lines = @(
            "ClawScribe $version ($short) - ${{ inputs.feature }} build (DirectML: ${{ inputs.feature == 'windows-gpu' || inputs.feature == 'directml' || inputs.directml }}).",
            "",
            "> Unsigned installer. ClawScribe is not yet code-signed, so Windows",
            "> SmartScreen may warn on first run: click More info -> Run anyway to",
            "> install. Code signing is planned for a later release.",
            "",
            "### What's changed",
            ""
          )
          if ("${{ inputs['draft-release'] }}" -eq "true") {
            $lines += "> DRAFT: native build and automated checks only. Real dual-source recording, installer interaction, and target-notebook performance must be verified before publication."
            $lines += ""
          }
          $lines += $changelog
          $lines += @(
            "",
            "### Update behavior",
            "- ``latest.json`` advertises runtime version ``$runtimeVersion``.",
            "- The app updater downloads the NSIS setup installer.",
            "",
            "### Install",
            "- Recommended: ``ClawScribe_${version}_x64-setup.exe``",
            "- Alternative: ``ClawScribe_${version}_x64_en-US.msi``",
            "",
            "### SHA-256 checksums",
            "",
            '```text'
          )
          $lines += (Get-Content -LiteralPath (Join-Path $bundleRoot "SHA256SUMS.txt"))
          $lines += '```'
          $lines | Set-Content -LiteralPath (Join-Path $bundleRoot "RELEASE-NOTES.md") -Encoding utf8

      - name: Generate updater manifest (latest.json)
        if: ${{ (inputs.publish || inputs['draft-release']) && !inputs['check-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $bundleRoot = "frontend\src-tauri\target\release\bundle"
          $sourceVersion = $env:CLAWSCRIBE_SOURCE_VERSION
          $manifestVersion = $env:CLAWSCRIBE_INSTALLER_VERSION
          # Published installer is the source-version-named NSIS setup (renamed by
          # the metadata step). Its signature signs the file bytes, so the .sig from
          # the original-named artifact is valid for the renamed copy too.
          #
          # The updater manifest version must match the stripped Windows/Tauri
          # runtime version. MSI ProductVersion cannot carry prerelease metadata,
          # so advertising 0.5.0-alpha.N makes an installed 0.5.0 runtime compare
          # as newer and report "latest".
          $nsisName = "ClawScribe_${sourceVersion}_x64-setup.exe"
          $sig = Get-ChildItem -Path (Join-Path $bundleRoot "nsis") -Filter "${nsisName}.sig" |
            Select-Object -First 1
          if (-not $sig) {
            throw "No .sig found - is createUpdaterArtifacts true and TAURI_SIGNING_PRIVATE_KEY set?"
          }
          $signature = (Get-Content -LiteralPath $sig.FullName -Raw).Trim()
          $url = "https://github.com/ch3573r/ClawScribe/releases/download/v$sourceVersion/$nsisName"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version   = $manifestVersion
            notes     = "See https://github.com/ch3573r/ClawScribe/releases/tag/v$sourceVersion"
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $signature; url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $bundleRoot "latest.json") -Encoding utf8

      - name: Refuse to turn a published version into a draft
        if: ${{ inputs['draft-release'] && !inputs['check-only'] }}
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v${{ env.CLAWSCRIBE_SOURCE_VERSION }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG
              });
              if (!release.draft) core.setFailed('This version is already published. Bump the version; never replace a public release with a draft.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Publish GitHub Release
        if: ${{ (inputs.publish || inputs['draft-release']) && !inputs['check-only'] }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CLAWSCRIBE_SOURCE_VERSION }}
          name: ClawScribe v${{ env.CLAWSCRIBE_SOURCE_VERSION }}
          body_path: frontend/src-tauri/target/release/bundle/RELEASE-NOTES.md
          target_commitish: ${{ steps.build_identity.outputs.commit }}
          draft: ${{ inputs['draft-release'] }}
          # Drafts never advance the installed stable updater.
          # The app updater points at /releases/latest/download/latest.json.
          # GitHub excludes prereleases from that route, so alpha builds must be
          # published as normal releases while this is the active update channel.
          prerelease: false
          make_latest: ${{ inputs['draft-release'] && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            frontend/src-tauri/target/release/bundle/msi/ClawScribe_${{ env.CLAWSCRIBE_SOURCE_VERSION }}_x64_en-US.msi
            frontend/src-tauri/target/release/bundle/nsis/ClawScribe_${{ env.CLAWSCRIBE_SOURCE_VERSION }}_x64-setup.exe
            frontend/src-tauri/target/release/bundle/latest.json
            frontend/src-tauri/target/release/bundle/SHA256SUMS.txt
            frontend/src-tauri/target/release/bundle/BUILD-METADATA.txt
            frontend/src-tauri/target/release/bundle/BUILD-METRICS.json
