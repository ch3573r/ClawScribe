name: Release readiness

on:
  push:
    branches:
      - 'review/meeting-reliability-2026-09-05'
      - 'release/**'
  pull_request:
    paths:
      - 'frontend/src-tauri/src/audio/async_logger.rs'
      - 'frontend/src-tauri/src/audio/hardware_detector.rs'
      - 'frontend/src-tauri/src/summary/**'
      - '.github/workflows/release-readiness.yml'
      - 'frontend/src-tauri/src/knowledge/documents/**'
      - 'frontend/scripts/test-reference-documents.ps1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Reference document parser and child-process contracts
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: 15
    steps:
      - name: Require the designated local build machine
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Document tests require the configured local machine.'
          }
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Public repository safety check
        run: node scripts/verify-public-repo-safety.mjs
      - name: Test production document parser and bounded child
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
        run: ./frontend/scripts/test-reference-documents.ps1
  core:
    name: Production core regression tests
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: 15
    steps:
      - name: Require the designated local build machine
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Builds require the local machine configured in CLAWSCRIBE_BUILD_RUNNER.'
          }
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Public repository safety check
        run: node scripts/verify-public-repo-safety.mjs
      - name: Test production modules without desktop/native dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $testRoot = Join-Path $env:RUNNER_TEMP "clawscribe-core-checks-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $sourceRoot = $env:GITHUB_WORKSPACE.Replace('\', '/')
          @"
          [package]
          name = "clawscribe-core-checks"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          [dependencies]
          log = "0.4"
          once_cell = "1"
          tokio = { version = "1", features = ["full", "test-util"] }
          tempfile = "3"
          sysinfo = "0.32"
          [[test]]
          name = "chunking"
          path = "$sourceRoot/frontend/src-tauri/src/summary/chunking.rs"
          [[test]]
          name = "async_logger"
          path = "$sourceRoot/frontend/src-tauri/src/audio/async_logger.rs"
          [[test]]
          name = "hardware_detector"
          path = "$sourceRoot/frontend/src-tauri/src/audio/hardware_detector.rs"
          "@ | Set-Content -LiteralPath (Join-Path $testRoot 'Cargo.toml') -Encoding utf8NoBOM
          cargo test --manifest-path (Join-Path $testRoot 'Cargo.toml') -- --nocapture
