name: Isolated release verifier tests
on:
  push:
    branches: ['tests/release-verifier-0.5.36']
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install fixture signature tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Exercise actual verifier with mocked GitHub responses and ephemeral signatures
        run: |
          node --check scripts/test-release-verification.cjs
          node scripts/test-release-verification.cjs
