name: Native library tests

# Runs the real Rust library test suite through the release preflight's native
# half (build-windows-release.ps1 -CheckOnly -NativeOnly: the same staging and the
# same required test groups) for trusted pull requests and for pushes to main.
# Everything runs on the designated local runner with its persistent,
# size-bounded build caches; there are no hosted runners and no Actions caches.
#
# The runner's pinned toolchain (Rust, LLVM, Vulkan SDK and loader) is verified,
# never installed or replaced by a pull request or push. Only a manual run with
# provision-toolchain may install what is missing. The frontend assets that the
# native build embeds are rebuilt from the checked-out commit on every run. The
# job holds read-only repository access and publishes, tags and uploads nothing.
on:
  pull_request:
    paths:
      - 'frontend/src-tauri/**'
      - 'llama-helper/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'frontend/scripts/*.ps1'
      - 'frontend/scripts/*.mjs'
      - '.github/workflows/native-library-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/src-tauri/**'
      - 'llama-helper/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'frontend/scripts/*.ps1'
      - 'frontend/scripts/*.mjs'
      - '.github/workflows/native-library-tests.yml'
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'Exact reviewed commit SHA to test'
        type: string
        default: ''
      provision-toolchain:
        description: 'Install a missing or different pinned toolchain on the runner (owner-started provisioning only)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: native-library-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-library-tests:
    name: Native library tests
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: 90
    steps:
      - name: Require the designated local build machine
        id: verify_runner
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BUILD_REF: ${{ inputs['build-ref'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Builds require the local machine configured in CLAWSCRIBE_BUILD_RUNNER.'
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and $env:BUILD_REF -notmatch '^[0-9a-f]{40}$') {
            throw 'Manual native tests require an immutable reviewed commit SHA.'
          }

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs['build-ref'] || github.sha }}
          clean: false
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Reject private paths and committed secrets
        run: node scripts/verify-public-repo-safety.mjs

      # Rust, LLVM and the Vulkan SDK are the pins of the release workflow. A
      # missing or different one fails here with what to provision.
      - name: Verify the pinned native toolchain
        id: toolchain
        env:
          PROVISION: ${{ github.event_name == 'workflow_dispatch' && inputs['provision-toolchain'] }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROVISION -eq 'true') {
            ./frontend/scripts/ensure-native-toolchain.ps1 -Provision -AllowMissingVulkanSdk
          } else {
            ./frontend/scripts/ensure-native-toolchain.ps1
          }

      # Reached only by a manual provisioning run on a runner without the SDK. It
      # stages the SDK in its own per-version folder, so a later run finds it by
      # content, and never overwrites the runner's own VULKAN_SDK.
      - name: Stage the pinned Vulkan SDK
        if: ${{ steps.toolchain.outputs.vulkan_sdk == 'missing' }}
        uses: ./.github/actions/vulkan-sdk
        with:
          version: 1.4.309.0
          install-missing: 'true'

      # Probes for a loadable vulkan-1.dll. Only a manual provisioning run may
      # install the SDK's signed runtime, and only when the loader is missing.
      - name: Verify the Vulkan loader
        env:
          PROVISION: ${{ github.event_name == 'workflow_dispatch' && inputs['provision-toolchain'] }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROVISION -eq 'true') {
            ./frontend/scripts/ensure-windows-vulkan-runtime.ps1 -InstallFromSdk
          } else {
            ./frontend/scripts/ensure-windows-vulkan-runtime.ps1
          }

      - name: Remove host-tuned Whisper build caches
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node frontend/scripts/verify-windows-portability.mjs --remove-stale

      - name: Bound the local build cache and require free space
        run: ./frontend/scripts/limit-native-test-cache.ps1

      - name: Build llama-helper sidecar
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          . ./frontend/scripts/configure-windows-portability.ps1
          "RUSTFLAGS=$env:RUSTFLAGS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PROJECT_INCLUDE=$env:CMAKE_PROJECT_INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo build -p llama-helper --release --locked --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\llama-helper.exe frontend\src-tauri\binaries\llama-helper-x86_64-pc-windows-msvc.exe -Force

      # The release preflight's native half: a clean rebuild of the embedded
      # frontend assets, locked cargo check, sidecar and runtime staging, then
      # every required native group in the release profile
      # (test-windows-native.ps1 fails on a missing, empty or failing group).
      - name: Run the required native library test groups
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd frontend
          .\scripts\build-windows-release.ps1 -Feature windows-gpu -CheckOnly -NativeOnly

      - name: Trim stale test executables after the run
        if: ${{ always() && steps.verify_runner.outcome == 'success' && steps.checkout.outcome == 'success' }}
        run: ./frontend/scripts/limit-native-test-cache.ps1 -NoFailOnLowSpace

      - name: Generate native test summary
        run: |
          @(
            '## Native library tests',
            '',
            "**Commit:** $(git rev-parse HEAD)",
            '',
            '- Designated local runner identity verified',
            '- Pinned toolchain verified (Rust, LLVM, Vulkan SDK and loader)',
            '- Frontend assets rebuilt from this commit before the native build',
            '- Locked native check and the required release-profile library test groups passed, including the self-test fixtures (migrate, import, loopback summary, reopen)',
            '- Not exercised: the packaged executable and installer, live capture, speech models, real providers and the interface; see docs/windows-release.md'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
