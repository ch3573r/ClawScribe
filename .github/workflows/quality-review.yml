name: Quality review implementation validation
on:
  push:
    branches: ['automation/quality-review-2026-09-06']
    paths: ['review-edits/**', 'review-tools/apply.py', 'review-tools/core_checks.py', '.github/workflows/quality-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-review-implementation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3e8ef924ca702a35366738f57b9312c0371236ed
          path: source
          persist-credentials: false
      - name: Verify baseline and all reviewed result hashes
        working-directory: source
        run: |
          python ../preparation/review-tools/apply.py ../preparation/review-edits
          git diff --cached --check
          node scripts/verify-public-repo-safety.mjs
      - name: Commit reviewed source to the isolated fix branch
        id: commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const branch = 'fix/meeting-quality-and-resource-limits';
            const files = cp.execFileSync('git', ['diff','--cached','--name-only'], {cwd:'source',encoding:'utf8'}).trim().split('\n');
            if (files.length !== 37 || files.some(p => p.startsWith('.github/') || p.includes('..'))) throw new Error('Unexpected source change set');
            const {data: ref} = await github.rest.git.getRef({...context.repo,ref:'heads/'+branch});
            const {data: parent} = await github.rest.git.getCommit({...context.repo,commit_sha:ref.object.sha});
            const {data: tree} = await github.rest.git.createTree({...context.repo,base_tree:parent.tree.sha,tree:files.map(path => ({path,mode:'100644',type:'blob',content:fs.readFileSync('source/'+path,'utf8')}))});
            const {data: commit} = await github.rest.git.createCommit({...context.repo,tree:tree.sha,parents:[ref.object.sha],message:'fix: address meeting UI races, transcript overhead and bounded recording resources\n\nExact inspected baseline and reviewed-result hashes verified. Full frontend and native validation run separately in this workflow; no release or published asset changes.'});
            await github.rest.git.updateRef({...context.repo,ref:'heads/'+branch,sha:commit.sha,force:false});
            core.setOutput('source_sha',commit.sha);
            await core.summary.addHeading('Reviewed implementation source').addRaw(commit.sha).write();
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
  core:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
      - uses: actions/checkout@v4
        with:
          path: preparation
      - uses: dtolnay/rust-toolchain@stable
      - run: python ../preparation/review-tools/core_checks.py
        working-directory: source
  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install native build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          choco install llvm --version=20.1.8 -y --no-progress --allow-downgrade
          choco install 7zip -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Configure and verify Vulkan runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          "$(Join-Path $env:VULKAN_SDK 'Bin')" >> $env:GITHUB_PATH
          "Vulkan_LIBRARY=$(Join-Path $env:VULKAN_SDK 'Lib/vulkan-1.lib')" >> $env:GITHUB_ENV
          "Vulkan_INCLUDE_DIR=$(Join-Path $env:VULKAN_SDK 'Include')" >> $env:GITHUB_ENV
          ./frontend/scripts/ensure-windows-vulkan-runtime.ps1 -InstallFromSdk
      - name: Build and test actual local-summary sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cargo build -p llama-helper --release --locked --target x86_64-pc-windows-msvc
          cargo test -p llama-helper --release --locked --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe -Force
      - name: Stage the pinned runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          ./frontend/scripts/stage-codex-runtime.ps1 -TauriRoot frontend/src-tauri
          ./frontend/scripts/stage-sherpa-runtime.ps1 -TauriRoot frontend/src-tauri -Runtime directml
      - name: Build the actual Windows application without publishing installers
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm exec tauri build --no-bundle -- --locked --features windows-gpu
      - name: Execute required production native regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          # Keep original required groups and additionally execute every new suite.
          $path='frontend/scripts/test-windows-native.ps1'
          $script=Get-Content -LiteralPath $path -Raw
          $before='"audio::hardware_detector::tests"))'
          $after='"audio::hardware_detector::tests", "audio::memory_queue::tests", "audio::process_runner::tests", "audio::incremental_saver::tests", "audio::recording_saver::tests", "summary::chat_context::tests", "summary::chat_guard::tests", "database::repositories::ai_chat::tests"))'
          if (-not $script.Contains($before)) { throw 'Required-suite source changed; review before continuing.' }
          $script.Replace($before,$after) | Set-Content -LiteralPath $path -Encoding utf8
          ./frontend/scripts/test-windows-native.ps1 -Features windows-gpu
