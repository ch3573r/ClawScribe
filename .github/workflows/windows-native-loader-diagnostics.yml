name: Windows Vulkan runtime validation

on:
  push:
    branches: ['fix/0.5.36-native-loader', 'release/**']
    paths: ['frontend/scripts/ensure-windows-vulkan-runtime.ps1', '.github/workflows/windows-native-loader-diagnostics.yml']
  workflow_dispatch:
    inputs:
      verify-only:
        description: 'Read-only: verify the pinned toolchain, find the Vulkan SDK by content and probe the loader, without installing, extracting or building anything'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  loader:
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: 10
    steps:
      - name: Require the designated local build machine
        shell: pwsh
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Builds require the local machine configured in CLAWSCRIBE_BUILD_RUNNER.'
          }

      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Parse preflight and check repository safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'frontend/scripts/ensure-windows-vulkan-runtime.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          node scripts/verify-public-repo-safety.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Repository safety check failed.' }
      # Read-only mode (manual runs only): nothing below it installs, stages or builds.
      - name: Verify the pinned native toolchain
        if: ${{ inputs['verify-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./frontend/scripts/ensure-native-toolchain.ps1
      - name: Find the pinned Vulkan SDK without installing it
        if: ${{ inputs['verify-only'] && !cancelled() }}
        uses: ./.github/actions/vulkan-sdk
        with:
          version: 1.4.309.0
          install-missing: 'false'
      - name: Probe the Vulkan loader without installing it
        if: ${{ inputs['verify-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./frontend/scripts/ensure-windows-vulkan-runtime.ps1
      - name: Summarize the read-only verification
        if: ${{ inputs['verify-only'] && success() }}
        shell: pwsh
        run: |
          @(
            '## Read-only toolchain verification',
            '',
            "**Commit:** $(git rev-parse HEAD)",
            '',
            '- Designated local runner identity verified',
            '- Pinned Rust, LLVM and Vulkan SDK found; the SDK was recognised by its content (see the candidate list above)',
            '- A loadable Vulkan loader was found',
            '- Nothing was installed, extracted, built or tested; this does not exercise the native test groups'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Use the exact release SDK
        if: ${{ !inputs['verify-only'] }}
        uses: ./.github/actions/vulkan-sdk
        with:
          version: 1.4.309.0
          install-missing: 'true'
      - name: Build a native load-time Vulkan dependency fixture
        if: ${{ !inputs['verify-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          #include <vulkan/vulkan.h>
          #include <stdio.h>
          int main(void) {
              uint32_t version = 0;
              VkResult result = vkEnumerateInstanceVersion(&version);
              printf("Vulkan loader API: %u.%u.%u (result=%d)\n",
                  VK_VERSION_MAJOR(version), VK_VERSION_MINOR(version), VK_VERSION_PATCH(version), result);
              return result == VK_SUCCESS ? 0 : 1;
          }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/vulkan-loader-probe.c" -Encoding ascii
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found.' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /I"{1}/Include" "{2}/vulkan-loader-probe.c" /Fe:"{2}/vulkan-loader-probe.exe" /Fo:"{2}/vulkan-loader-probe.obj" /link /LIBPATH:"{1}/Lib" vulkan-1.lib' -f $vcvars, $env:VULKAN_SDK, $env:RUNNER_TEMP
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan fixture compilation failed.' }
      - name: Verify missing-runtime rejection, installation and idempotence
        if: ${{ !inputs['verify-only'] }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $handle = [IntPtr]::Zero
          $found = [System.Runtime.InteropServices.NativeLibrary]::TryLoad('vulkan-1.dll', [ref]$handle)
          Write-Host "AFTER_SDK_EXTRACTION_VULKAN_LOADER=$found"
          if ($found) {
            [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
          } else {
            $rejected = $false
            try { ./frontend/scripts/ensure-windows-vulkan-runtime.ps1 } catch {
              if ($_.Exception.Message -notlike '*Cannot load vulkan-1.dll*') { throw }
              $rejected = $true
              Write-Host 'Missing runtime correctly rejected without opt-in installation.'
            }
            if (-not $rejected) { throw 'Preflight accepted a missing Vulkan runtime.' }
            & "$env:RUNNER_TEMP/vulkan-loader-probe.exe"
            $before = $LASTEXITCODE
            Write-Host "BEFORE_INSTALL_NATIVE_PROBE_EXIT=$before"
            if ($before -ne -1073741515) { throw "Expected STATUS_DLL_NOT_FOUND, got $before." }
          }
          ./frontend/scripts/ensure-windows-vulkan-runtime.ps1 -InstallFromSdk
          & "$env:RUNNER_TEMP/vulkan-loader-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native Vulkan loader fixture failed: $LASTEXITCODE" }
          ./frontend/scripts/ensure-windows-vulkan-runtime.ps1 -InstallFromSdk
          ./frontend/scripts/ensure-windows-vulkan-runtime.ps1
          Write-Host 'Native loader fixture passed. GPU inference and live capture were not exercised.'
