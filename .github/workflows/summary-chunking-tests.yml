name: Summary chunking regression tests

on:
  pull_request:
    paths:
      - 'frontend/src-tauri/src/summary/**'
      - '.github/workflows/summary-chunking-tests.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src-tauri/src/summary/**'
      - '.github/workflows/summary-chunking-tests.yml'
  workflow_dispatch:
    inputs:
      knowledge:
        description: 'Run manual local embedding validation'
        type: boolean
        default: false
      build-ref:
        description: 'Exact reviewed commit SHA for knowledge validation'
        type: string
        default: ''
      full-suite:
        description: 'Run complete native library suite (disable only for focused acceptance reruns)'
        type: boolean
        default: true
      acceptance:
        description: 'Download pinned model and run native resource/parity gate'
        type: boolean
        default: false
      retrieval-acceptance:
        description: 'Run synthetic 10000-passage local retrieval workload'
        type: boolean
        default: false
      mutation-acceptance:
        description: 'Measure synthetic 10000-row FTS updates and deletes'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: summary-chunking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chunking:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: ${{ inputs.knowledge && 60 || 5 }}
    steps:
      - name: Require the designated local build machine
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          KNOWLEDGE: ${{ inputs.knowledge }}
          BUILD_REF: ${{ inputs['build-ref'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Builds require the local machine configured in CLAWSCRIBE_BUILD_RUNNER.'
          }
          if ($env:KNOWLEDGE -eq 'true' -and $env:BUILD_REF -notmatch '^[0-9a-f]{40}$') {
            throw 'An immutable reviewed commit SHA is required.'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.knowledge && inputs['build-ref'] || github.sha }}
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.knowledge }}
        with:
          targets: x86_64-pc-windows-msvc
      - name: Compile production chunker and its unit tests without desktop dependencies
        if: ${{ !inputs.knowledge }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $testExe = Join-Path $env:RUNNER_TEMP "summary-chunking-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.exe"
          rustc --version
          rustc --edition=2021 --test frontend/src-tauri/src/summary/chunking.rs -o $testExe
      - name: Verify source coverage, Unicode, overlap, and token budgets
        if: ${{ !inputs.knowledge }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:RUNNER_TEMP "summary-chunking-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.exe")
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.knowledge && inputs.acceptance }}
        with:
          python-version: '3.11'
          cache: ''
      - uses: humbletim/install-vulkan-sdk@v1.2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.knowledge }}
        with:
          version: 1.4.309.0
          cache: false
      - name: Run knowledge validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.knowledge }}
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUN_ACCEPTANCE: ${{ inputs.acceptance }}
          FULL_SUITE: ${{ inputs['full-suite'] }}
          RETRIEVAL_ACCEPTANCE: ${{ inputs['retrieval-acceptance'] }}
          MUTATION_ACCEPTANCE: ${{ inputs['mutation-acceptance'] }}
        run: ./frontend/scripts/test-knowledge.ps1 -Acceptance:($env:RUN_ACCEPTANCE -eq 'true') -FullSuite:($env:FULL_SUITE -ne 'false') -RetrievalAcceptance:($env:RETRIEVAL_ACCEPTANCE -eq 'true') -MutationAcceptance:($env:MUTATION_ACCEPTANCE -eq 'true')
