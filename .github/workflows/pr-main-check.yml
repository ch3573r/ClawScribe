name: "Validation Check"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnose-timeline-worker:
        description: 'Compare timeline tests without worker isolation and serial/full workers'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-check:
    name: Validation Check
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    runs-on: [self-hosted, Windows, X64, clawscribe]
    timeout-minutes: 15
    steps:
      - name: Require the designated local build machine
        env:
          EXPECTED_BUILD_RUNNER: ${{ vars.CLAWSCRIBE_BUILD_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_BUILD_RUNNER) -or
              $env:RUNNER_NAME -ine $env:EXPECTED_BUILD_RUNNER -or
              $env:COMPUTERNAME -ine $env:EXPECTED_BUILD_RUNNER) {
            throw 'Builds require the local machine configured in CLAWSCRIBE_BUILD_RUNNER.'
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reject private paths and committed secrets
        run: node scripts/verify-public-repo-safety.mjs

      - name: Verify local build and storage policy
        run: node --test scripts/verify-workflow-policy.test.mjs

      - name: Install frontend dependencies and clear stale route types
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $generatedRouteTypes = Join-Path $PWD.Path '.next/types'
          if (Test-Path -LiteralPath $generatedRouteTypes) {
            $resolved = (Resolve-Path -LiteralPath $generatedRouteTypes).Path
            $prefix = $PWD.Path.TrimEnd([char]92, [char]47) + [System.IO.Path]::DirectorySeparatorChar
            if (-not $resolved.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Generated route types are outside the frontend workspace.'
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
          pnpm install --frozen-lockfile

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'frontend/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $version"

      - name: Guard removed legacy backend
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'backend') {
            throw 'The legacy backend directory was removed and must not be reintroduced.'
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $forbidden = @(git grep -n -E 'backend/|whisper-server-package|jfk\.(wav|mp3)' -- ':!backend/**' ':!.github/workflows/pr-main-check.yml')
          if ($LASTEXITCODE -gt 1) { throw 'Legacy reference search failed.' }
          if ($forbidden.Count -gt 0) { throw 'Removed backend references were found.' }
          exit 0

      - name: Validate version format
        env:
          SOURCE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if ($env:SOURCE_VERSION -match '^\d+\.\d+\.\d+$') {
            Write-Host "Version format is valid: $env:SOURCE_VERSION"
          } else {
            Write-Warning 'Version may not be in X.Y.Z format.'
          }

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test frontend helpers
        if: ${{ !inputs['diagnose-timeline-worker'] }}
        working-directory: frontend
        run: pnpm test

      - name: Diagnose timeline test worker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['diagnose-timeline-worker'] }}
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $failures = 0
          node --version
          node --test --test-isolation=none tests/lib/speaker-timeline.test.mjs
          if ($LASTEXITCODE -ne 0) { $failures++ }
          node --test tests/lib/speaker-timeline.test.mjs
          if ($LASTEXITCODE -ne 0) { $failures++ }
          node --test --test-concurrency=1 tests/lib/*.test.mjs
          if ($LASTEXITCODE -ne 0) { $failures++ }
          if ($failures -ne 0) { throw "$failures frontend diagnostic variants failed." }

      - name: Generate validation summary
        env:
          SOURCE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          @(
            '## Validation Check Summary',
            '',
            "**Version:** $env:SOURCE_VERSION",
            "**Commit:** $env:GITHUB_SHA",
            '',
            '- Designated local runner identity verified',
            '- Public repository safety and workflow policy checks completed',
            '- Removed legacy backend guard completed',
            '- Frontend typecheck and helper tests completed'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
