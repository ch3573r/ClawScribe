name: Verify and publish 0.5.36 preview
on:
  push:
    branches: ['verification/0.5.36-preview']
permissions:
  actions: read
  contents: write
concurrency:
  group: verify-clawscribe-0.5.36-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate verification script syntax
        run: node --check scripts/verify-0.5.36-preview.cjs
      - name: Install independent updater signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Verify native results, downloaded assets and signatures; publish prerelease only
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/verify-0.5.36-preview.cjs')({github, context, core});
      - name: Retain verified setup and verification record
        uses: actions/upload-artifact@v4
        with:
          name: clawscribe-0.5.36-verified-setup
          path: |
            verified-release/ClawScribe_0.5.36_x64-setup.exe
            verified-release/SHA256SUMS.txt
            verified-release/BUILD-METADATA.txt
            verified-release/RELEASE-VERIFICATION.json
            verified-release/RELEASE-NOTES.md
          retention-days: 3
          if-no-files-found: error
