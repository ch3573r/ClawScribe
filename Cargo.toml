[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Workspace-level patches apply to every member. Cargo ignores patches placed
# in frontend/src-tauri because it is not the workspace root. Changing this
# active cpal revision requires a real Windows microphone + system-audio capture
# smoke before publishing a release.
[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }

# esaxx-rs intentionally remains on crates.io. A former patch in the member
# manifest was never active; enabling a replacement now would be a separate
# dependency behavior change that needs its own review and Windows validation.

# Release builds for every workspace member. ThinLTO runs across the default
# 16 codegen units in parallel; forcing codegen-units = 1 serialised LLVM over
# the whole app crate for little runtime gain, since the speech, ONNX and ggml
# hot paths are native C/C++ libraries this profile does not compile.
[profile.release]
lto = "thin"
strip = true

# Dependencies keep line tables (readable backtraces) but no full debug info,
# which keeps the debug target folder and link times smaller. Workspace crates
# keep full debug info for stepping through ClawScribe code.
[profile.dev.package."*"]
debug = "line-tables-only"
